plugins {
    id 'java-gradle-plugin'
}

dependencies {
    implementation project(':rutter-api')
    implementation project(':rutter-core')

    testImplementation gradleTestKit()
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

gradlePlugin {
    plugins {
        rutter {
            id = 'io.github.intisy.rutter'
            implementationClass = 'io.github.intisy.rutter.gradle.RutterPlugin'
        }
    }
}

def versionFile = layout.buildDirectory.file('generated/rutter-version/rutter-gradle-version.properties')
def versionProvider = providers.provider { project.version.toString() }

/**
 * @implNote The plugin resolves the embedded runtime pieces at its own version, so the version has
 *     to reach it at execution time; a generated resource is the only channel that survives being
 *     applied from a published jar.
 */
def writeRutterVersion = tasks.register('writeRutterVersion') {
    inputs.property('version', versionProvider)
    outputs.file(versionFile)
    doLast {
        def file = versionFile.get().asFile
        file.parentFile.mkdirs()
        file.setText("version=${versionProvider.get()}\n", 'UTF-8')
    }
}

tasks.named('processResources') {
    from(writeRutterVersion)
}

def testRepository = rootProject.layout.buildDirectory.dir('test-repo')
def testmodModules = project(':rutter-testmod').layout.buildDirectory.dir('modules')
def testmodReferenceJar = project(':rutter-testmod').layout.buildDirectory
        .file('universal/rutter-testmod-universal.jar')

def subprojectsToPublish = rootProject.ext.embeddedArtifactPaths

/**
 * @implNote The differential gate reaches its reference material through system properties, which
 *     are opaque strings to Gradle, so without these declarations the content of the reference jar,
 *     the module jars and the published test repository is not a task input: editing any of them
 *     left {@code test} UP-TO-DATE and the acceptance gate silently did not run.
 */
tasks.named('test') {
    subprojectsToPublish.each { path ->
        dependsOn "${path}:publishAllPublicationsToRutterTestRepository"
    }
    dependsOn ':rutter-testmod:universalJar'

    inputs.file(testmodReferenceJar)
            .withPropertyName('rutterReferenceJar')
            .withPathSensitivity(PathSensitivity.NAME_ONLY)
    inputs.dir(testmodModules)
            .withPropertyName('rutterModuleJars')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(testRepository)
            .withPropertyName('rutterTestRepository')
            .withPathSensitivity(PathSensitivity.RELATIVE)

    systemProperty 'rutter.test.repo', testRepository.get().asFile.absolutePath
    systemProperty 'rutter.test.modules', testmodModules.get().asFile.absolutePath
    systemProperty 'rutter.test.reference', testmodReferenceJar.get().asFile.absolutePath
}
