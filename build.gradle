import io.github.intisy.rutter.gradle.ClassFileVersionTask

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = 'io.github.intisy.rutter'
    version = rootProject.version

    repositories {
        mavenCentral()
        maven { name = 'fabric';     url = 'https://maven.fabricmc.net/' }
        maven { name = 'forge';      url = 'https://maven.minecraftforge.net/' }
        maven { name = 'neoforged';  url = 'https://maven.neoforged.net/releases/' }
        maven { name = 'sponge';     url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { name = 'mojang';     url = 'https://libraries.minecraft.net/' }
        maven {
            name = 'multimc'
            url = 'https://files.multimc.org/maven/'
            metadataSources { artifact() }
        }
    }

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 8
        options.compilerArgs << '-Xlint:-options' // Java 8 floor is deliberate; the JDK's obsolescence notice is not actionable
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging { exceptionFormat = 'full' }
    }

    tasks.register('checkClassFileVersion', ClassFileVersionTask) {
        jar = tasks.jar.archiveFile
    }

    tasks.named('check') {
        dependsOn tasks.named('checkClassFileVersion')
    }
}
