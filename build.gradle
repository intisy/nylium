import io.github.intisy.nylium.gradle.ClassFileVersionTask

/**
 * @implNote These six are the artifacts {@code nyliumUniversalJar} embeds, and the only ones a
 *     release actually publishes; {@code nylium-gradle} keeps its own {@code java-gradle-plugin}
 *     publication instead of a second one at the same coordinates, and {@code nylium-testmod}/
 *     {@code smoke} are not release artifacts.
 */
ext.embeddedArtifactPaths = [':nylium-api', ':nylium-core', ':nylium-bootstrap-fabric',
                             ':nylium-bootstrap-launchwrapper', ':nylium-bootstrap-modlauncher8',
                             ':nylium-bootstrap-modlauncher9']

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = 'io.github.intisy.nylium'
    version = rootProject.version

    repositories {
        mavenCentral()
        maven { name = 'fabric';     url = 'https://maven.fabricmc.net/' }
        maven { name = 'forge';      url = 'https://maven.minecraftforge.net/' }
        maven { name = 'sponge';     url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { name = 'mojang';     url = 'https://libraries.minecraft.net/' }
        maven {
            name = 'multimc'
            url = 'https://files.multimc.org/maven/'
            metadataSources { artifact() }
        }
    }

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 8
        options.compilerArgs << '-Xlint:-options' // Java 8 floor is deliberate; the JDK's obsolescence notice is not actionable
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging { exceptionFormat = 'full' }
    }

    tasks.register('checkClassFileVersion', ClassFileVersionTask) {
        jar = tasks.jar.archiveFile
    }

    tasks.named('check') {
        dependsOn tasks.named('checkClassFileVersion')
    }

    publishing {
        repositories {
            maven {
                name = 'nyliumTest'
                url = rootProject.layout.buildDirectory.dir('test-repo')
            }
        }
        if (embeddedArtifactPaths.contains(project.path)) {
            publications {
                maven(MavenPublication) {
                    from components.java
                }
            }
        }
    }
}
