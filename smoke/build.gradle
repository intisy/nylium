import org.gradle.jvm.toolchain.JavaLanguageVersion

dependencies {
    testImplementation project(':rutter-api')
}

def serversDir = layout.buildDirectory.dir('servers')

/**
 * @implNote The ambient PATH "java" that runs a Gradle task's own actions is whatever launched the
 * Gradle daemon, not necessarily a version a spawned Minecraft server needs (1.21.x needs Java 21;
 * older loaders need Java 8), so both provisioning and the smoke tests resolve a toolchain launcher
 * per required version rather than trusting PATH or a test JVM's own java.home. Each call returns a
 * lazy Provider; nothing here resolves an actual JDK until a task's action reads it.
 */
def javaLauncherFor(int version) {
    javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(version)
    }
}

def java8 = javaLauncherFor(8)
def java17 = javaLauncherFor(17)
def java21 = javaLauncherFor(21)

tasks.register('provisionFabricServers') {
    onlyIf { project.hasProperty('rutterSmoke') } // dependants' onlyIf does not gate a dependency's own execution
    dependsOn ':rutter-testmod:universalJar'
    doLast {
        String javaExecutable = java21.get().executablePath.asFile.absolutePath
        ['1.21.11', '1.21.10'].each { mcVersion ->
            File dir = serversDir.get().dir("fabric-${mcVersion}").asFile
            dir.mkdirs()
            File launcher = new File(dir, 'fabric-server-launch.jar')
            if (!launcher.exists()) {
                String url = "https://meta.fabricmc.net/v2/versions/loader/${mcVersion}/0.16.9/1.0.1/server/jar"
                launcher.withOutputStream { out -> new URL(url).withInputStream { out << it } }
            }
            new File(dir, 'mods').mkdirs()
            copy {
                from project(':rutter-testmod').layout.buildDirectory.file('universal/rutter-testmod-universal.jar')
                into new File(dir, 'mods')
            }
            new File(dir, 'eula.txt').text = 'eula=true\n'

            predownloadServerJar(dir, mcVersion, javaExecutable)
        }
    }
}

/**
 * @implNote The Fabric server launcher fetches the vanilla server jar on its first launch. Doing
 * that inside the timed smoke run would race the harness's timeout against a large download, so
 * provisioning launches the server once itself here and stops it once boot completes. Readiness is
 * detected by matching the literal "Done (" in the server log, the standard Minecraft/Fabric ready
 * message; this is a version-coupled assumption, so a provisioning timeout for a future Minecraft
 * version should be debugged starting from this string, not treated as a network flake.
 */
def predownloadServerJar(File dir, String mcVersion, String javaExecutable) {
    File librariesDir = new File(dir, 'libraries')
    if (librariesDir.directory && librariesDir.list()?.length > 0) {
        return
    }
    File log = new File(dir, 'provision.log')
    Process process = new ProcessBuilder([javaExecutable, '-jar', 'fabric-server-launch.jar', 'nogui'])
            .directory(dir)
            .redirectErrorStream(true)
            .redirectOutput(log)
            .start()
    try {
        long deadline = System.nanoTime() + java.time.Duration.ofMinutes(5).toNanos()
        boolean ready = false
        while (System.nanoTime() < deadline) {
            if (log.exists() && log.text.contains('Done (')) {
                ready = true
                break
            }
            if (!process.alive) {
                break
            }
            Thread.sleep(500)
        }
        if (!ready) {
            String captured = log.exists() ? log.text : '(no log)'
            throw new GradleException("Fabric ${mcVersion} pre-download did not complete. Log:\n${captured}")
        }
    } finally {
        process.destroyForcibly()
        process.waitFor()
    }
}

/**
 * @implNote The Forge 1.7.10 installer's {@code --installServer} run downloads the vanilla server
 * jar and every Forge library, which would race the harness's timeout if done inside the timed
 * smoke run. Provisioning runs it once here and fails with the captured log if it does not
 * complete, so the smoke test itself only ever launches an already-installed server.
 */
tasks.register('provisionForge1710') {
    onlyIf { project.hasProperty('rutterSmoke') } // dependants' onlyIf does not gate a dependency's own execution
    dependsOn ':rutter-testmod:universalJar'
    doLast {
        String forgeVersion = '1.7.10-10.13.4.1614-1.7.10'
        String installerUrl = "https://maven.minecraftforge.net/net/minecraftforge/forge/${forgeVersion}/forge-${forgeVersion}-installer.jar"
        File dir = serversDir.get().dir('forge-1.7.10').asFile
        dir.mkdirs()
        File serverJar = new File(dir, 'forge-server.jar')
        if (!serverJar.exists()) {
            File installer = new File(dir, 'forge-installer.jar')
            installer.withOutputStream { out -> new URL(installerUrl).withInputStream { out << it } }
            installForgeServer(dir, installer, java8.get().executablePath.asFile.absolutePath)
            File universal = new File(dir, "forge-${forgeVersion}-universal.jar")
            if (!universal.isFile()) {
                throw new GradleException("Forge installer did not produce ${universal}")
            }
            File mixinJar = resolveMixinJar()
            File mixinCopy = new File(dir, mixinJar.name)
            mixinCopy.bytes = mixinJar.bytes
            buildForgeServerLauncher(universal, mixinCopy, serverJar)
        }
        File modsDir = new File(dir, 'mods')
        modsDir.mkdirs()
        copy {
            from project(':rutter-testmod').layout.buildDirectory.file('universal/rutter-testmod-universal.jar')
            into modsDir
        }
        new File(dir, 'eula.txt').text = 'eula=true\n'
    }
}

def resolveMixinJar() {
    project.configurations.detachedConfiguration(
            project.dependencies.create('org.spongepowered:mixin:0.8.7')
    ).resolve().find { it.name.startsWith('mixin') }
}

/**
 * @implNote Forge 1.7.10 predates ModLauncher and never bundles Mixin, so {@code RutterTweaker}'s
 * {@code MixinBootstrap.init()} call needs Mixin on the server's classpath at runtime even though
 * it is compileOnly for the bootstrap module. Rather than hand-editing the installed universal
 * jar's own manifest, this writes a small launcher stub jar with the same Main-Class and a
 * Class-Path that is the original jar's Class-Path plus the universal jar itself and Mixin, using
 * {@link java.util.jar.Manifest#write} so the 72-byte continuation-line wrapping the jar spec
 * requires is handled correctly rather than reimplemented by hand.
 */
def buildForgeServerLauncher(File originalUniversal, File mixinJar, File serverJar) {
    String originalClassPath
    new java.util.jar.JarFile(originalUniversal).withCloseable { jar ->
        originalClassPath = jar.manifest.mainAttributes.getValue('Class-Path')
    }
    java.util.jar.Manifest manifest = new java.util.jar.Manifest()
    java.util.jar.Attributes attributes = manifest.mainAttributes
    attributes.putValue('Manifest-Version', '1.0')
    attributes.putValue('Main-Class', 'cpw.mods.fml.relauncher.ServerLaunchWrapper')
    attributes.putValue('Class-Path', "${originalClassPath} ${originalUniversal.name} ${mixinJar.name}")
    serverJar.withOutputStream { out ->
        new java.util.jar.JarOutputStream(out, manifest).close()
    }
}

/**
 * @implNote {@code --installServer} is a self-terminating process, unlike the Fabric server it
 * runs itself to completion rather than needing a log-based readiness poll; a non-zero exit or a
 * timeout is reported with the captured log so a stalled download is a clear provisioning failure
 * rather than a smoke test timeout.
 */
def installForgeServer(File dir, File installer, String javaExecutable) {
    File log = new File(dir, 'provision.log')
    Process process = new ProcessBuilder([javaExecutable, '-jar', installer.name, '--installServer'])
            .directory(dir)
            .redirectErrorStream(true)
            .redirectOutput(log)
            .start()
    boolean completed = process.waitFor(10, java.util.concurrent.TimeUnit.MINUTES)
    if (!completed) {
        process.destroyForcibly()
        process.waitFor()
        String captured = log.exists() ? log.text : '(no log)'
        throw new GradleException("Forge 1.7.10 installer did not complete within 10 minutes. Log:\n${captured}")
    }
    if (process.exitValue() != 0) {
        String captured = log.exists() ? log.text : '(no log)'
        throw new GradleException("Forge 1.7.10 installer exited with code ${process.exitValue()}. Log:\n${captured}")
    }
}

/**
 * @implNote onlyIf gates a task's own action, never an edge; adding these dependsOn calls only
 * under the same condition keeps an ungated build from ever putting either provisioning task, or
 * its universalJar dependency, into the task graph at all.
 */
def gateProvisioningIntoSmokeTest() {
    if (project.hasProperty('rutterSmoke')) {
        tasks.named('test') {
            dependsOn tasks.named('provisionFabricServers')
            dependsOn tasks.named('provisionForge1710')
        }
    }
}
gateProvisioningIntoSmokeTest()

tasks.named('test') {
    onlyIf { project.hasProperty('rutterSmoke') } // opt-in: downloads loader installers and launches servers
    systemProperty 'rutter.smoke.servers', serversDir.get().asFile.absolutePath
    javaLauncher = java21
    doFirst {
        systemProperty 'rutter.smoke.java.8', java8.get().executablePath.asFile.absolutePath
        systemProperty 'rutter.smoke.java.17', java17.get().executablePath.asFile.absolutePath
        systemProperty 'rutter.smoke.java.21', java21.get().executablePath.asFile.absolutePath
    }
}
